# Augments (or creates) the shared troi conda environment with
# pysentinel2's geospatial stack:
#
#   conda env update -n troi -f environment.yml
#   conda activate troi
#   pip install -e ../troi && pip install -e .
#
# Never use --prune: the env is shared across lab repos.
name: troi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # shared core (troi)
  - attrs
  - tabulate
  - typing_extensions
  # pysentinel2
  - numpy
  - scipy
  - xarray
  - zarr
  - dask
  - rioxarray
  - rasterio
  - odc-stac
  - pystac-client
  - pyproj
  - urllib3
